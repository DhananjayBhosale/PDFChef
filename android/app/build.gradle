apply plugin: 'com.android.application'

def releaseStoreFile = providers.gradleProperty('ZENPDF_RELEASE_STORE_FILE')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_STORE_FILE'))
def releaseStorePassword = providers.gradleProperty('ZENPDF_RELEASE_STORE_PASSWORD')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_STORE_PASSWORD'))
def releaseKeyAlias = providers.gradleProperty('ZENPDF_RELEASE_KEY_ALIAS')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_KEY_ALIAS'))
def releaseKeyPassword = providers.gradleProperty('ZENPDF_RELEASE_KEY_PASSWORD')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_KEY_PASSWORD'))
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasReleaseSigningConfig = releaseSigningValues.every { provider ->
    provider.orNull?.trim()
}
def hasPartialReleaseSigningConfig = releaseSigningValues.any { provider ->
    provider.orNull?.trim()
} && !hasReleaseSigningConfig

if (hasPartialReleaseSigningConfig) {
    throw new GradleException('Release signing requires all four ZENPDF_RELEASE_* values.')
}

android {
    namespace = "com.dhananjaytech.zenpdf_allpdftoolsinoneplace"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.dhananjaytech.pdfchef"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "2.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile.get())
                storePassword releaseStorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        minifiedQa {
            initWith release
            applicationIdSuffix ".minifiedqa"
            versionNameSuffix "-minified-qa"
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    sourceSets {
        androidTest {
            assets.srcDir '../../tests/fixtures/signatures'
        }
        minifiedQa {
            java.srcDir 'src/release/java'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    androidResources {
        // Only the app's own languages (res/xml/locales_config.xml). Library translations for others
        // would let Android pick, say, Ukrainian over a Russian the app supports, in English, while
        // the web screens pick Russian.
        localeFilters += ["en", "ar", "da", "de", "es", "b+es+419", "fr", "fr-rCA", "hi", "in", "it", "ja",
                          "ko", "nl", "pl", "pt-rBR", "pt-rPT", "ru", "sv", "tr", "b+zh+Hans", "b+zh+Hant"]
    }
    bundle {
        // The in-app language picker applies its choice itself, so every language must be on the
        // phone. With language splits Play would install only the phone's languages.
        language {
            enableSplit = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.datastore:datastore-preferences-proto:1.2.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'androidx.pdf:pdf-viewer-fragment:1.0.0-beta01'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.android.billingclient:billing:9.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
