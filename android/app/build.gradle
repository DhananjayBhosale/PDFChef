apply plugin: 'com.android.application'

def releaseStoreFile = providers.gradleProperty('ZENPDF_RELEASE_STORE_FILE')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_STORE_FILE'))
def releaseStorePassword = providers.gradleProperty('ZENPDF_RELEASE_STORE_PASSWORD')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_STORE_PASSWORD'))
def releaseKeyAlias = providers.gradleProperty('ZENPDF_RELEASE_KEY_ALIAS')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_KEY_ALIAS'))
def releaseKeyPassword = providers.gradleProperty('ZENPDF_RELEASE_KEY_PASSWORD')
        .orElse(providers.environmentVariable('ZENPDF_RELEASE_KEY_PASSWORD'))
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasReleaseSigningConfig = releaseSigningValues.every { provider ->
    provider.orNull?.trim()
}
def hasPartialReleaseSigningConfig = releaseSigningValues.any { provider ->
    provider.orNull?.trim()
} && !hasReleaseSigningConfig

if (hasPartialReleaseSigningConfig) {
    throw new GradleException('Release signing requires all four ZENPDF_RELEASE_* values.')
}

android {
    namespace = "com.dhananjaytech.zenpdf_allpdftoolsinoneplace"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.dhananjaytech.pdfchef"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "2.2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile.get())
                storePassword releaseStorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        minifiedQa {
            initWith release
            applicationIdSuffix ".minifiedqa"
            versionNameSuffix "-minified-qa"
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    sourceSets {
        minifiedQa {
            java.srcDir 'src/release/java'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.datastore:datastore-preferences-proto:1.2.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'androidx.pdf:pdf-viewer-fragment:1.0.0-beta01'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
