    <!-- The packaged shell boundary. Everything parsed after this element is subject
         to it, which covers every inline script, the built module and the built
         stylesheet in the production document. No remote runtime asset is permitted:
         scripts, styles, workers and connections resolve to this origin, previews and
         the one build-inlined face resolve to data or blob, WASM runs without
         unsafe-eval, and the two inline blocks below are admitted by
         their exact content hashes rather than by unsafe-inline. The single remote
         connect entry is the canonical host the retired-host redirect probes; it is
         unreachable from the packaged localhost shell. frame-ancestors is omitted
         because a meta-delivered policy must ignore it and would log doing so. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-qMjuAOPOEDIrf4vx6BXyVF+DONy83NemGR1cg1lbOAk=' 'sha256-Xcwt7cOmPovdFFRjVKObF4J9aEsWbuDJHD2HpRdscD4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self' blob:; connect-src 'self' data: blob: https://pdfchef.dhananjaytech.app"
    />
    <!-- viewport-fit=cover hands the safe-area insets to CSS; without it the tab
         bar sits above the home indicator instead of behind it. No maximum-scale
         and no user-scalable=no: pinch zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script>
      (function () {
        var oldHost = "pdftools.dhananjaytech.app";
        var newHost = "pdfchef.dhananjaytech.app";
        // Inert in every packaged shell: those are served from localhost, which is
        // never the retired public host, and the native bridge is refused outright.
        // The target is fixed to https so the redirect can never step down a scheme.
        if (window.Capacitor) return;
        if (window.location.hostname !== oldHost) return;

        var target =
          "https://" +
          newHost +
          window.location.pathname +
          window.location.search +
          window.location.hash;

        var controller = new AbortController();
        var timeout = window.setTimeout(function () {
          controller.abort();
        }, 1500);

        fetch("https://" + newHost + "/cdn-cgi/trace", {
          method: "GET",
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal,
        })
          .then(function () {
            window.location.replace(target);
          })
          .catch(function () {})
          .finally(function () {
            window.clearTimeout(timeout);
          });
      })();
    </script>
