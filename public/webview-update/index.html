<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Shown by the Android shell instead of the app when the phone's WebView is older than
         android.minWebViewVersion in capacitor.config.ts. It must work on those WebViews, so it
         uses no build step, no module and only plain ES5 in webview-update.js. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Update Android System WebView</title>
    <style>
      :root { --bg: #f8f5ef; --text: #17100f; --muted: #5c524f; --accent: #dc2020; --on-accent: #fffcfa; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #16140f; --text: #f5efe9; --muted: #c4b8b3; --accent: #ff4d52; --on-accent: #17100f; }
      }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body {
        box-sizing: border-box; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        font-family: system-ui, Roboto, "Noto Sans", sans-serif;
      }
      main { max-width: 28rem; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.3; }
      p { margin: 0 0 24px; font-size: 1rem; line-height: 1.5; color: var(--muted); }
      a {
        display: inline-block; min-height: 48px; padding: 0 24px; border-radius: 999px; line-height: 48px;
        background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Update Android System WebView</h1>
      <p id="message">PDF Chef needs a newer version of Android System WebView. Update it on Google Play, then open PDF Chef again.</p>
      <a id="play" href="https://play.google.com/store/apps/details?id=com.google.android.webview">Open Google Play</a>
    </main>
    <script src="webview-update.js"></script>
  </body>
</html>
